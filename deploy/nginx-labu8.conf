# /etc/nginx/sites-available/labu8  (o /etc/nginx/conf.d/labu8.conf)

server {
    listen 80;
    server_name labu8.disc.ucn.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name labu8.disc.ucn.cl;

    ssl_certificate     /etc/ssl/certs/ucn.crt;
    ssl_certificate_key /etc/ssl/private/ucn.key;

    # Las fotos de los equipos pesan hasta 8 MB; sin esto fallan al subirse.
    client_max_body_size 12M;

    access_log /var/log/nginx/labu8.access.log;
    error_log  /var/log/nginx/labu8.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # Mientras no haya inicio de sesión institucional, limitar el acceso a la
    # red del laboratorio es la medida más simple. Ajustar los rangos.
    # allow 10.0.0.0/8;
    # allow 146.83.0.0/16;
    # deny  all;
}
